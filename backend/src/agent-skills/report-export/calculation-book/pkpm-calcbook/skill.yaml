grants:
  - generate_report
software: pkpm
engineId: builtin-pkpm
adapterKey: builtin-pkpm
autoLoadByDefault: false
priority: 60
compatibility:
  minRuntimeVersion: "0.1.0"
  skillApiVersion: v1
