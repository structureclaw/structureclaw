name: Analysis Regression

on:
  pull_request:
    paths:
      - 'backend/src/agent-skills/analysis/**'
      - 'backend/src/skill-shared/python/**'
      - 'scripts/cli/**'
      - 'tests/**'
      - 'sclaw'
      - 'package.json'
      - '.github/workflows/backend-regression.yml'
      - '.github/workflows/analysis-regression.yml'
  push:
    branches:
      - master
    paths:
      - 'backend/src/agent-skills/analysis/**'
      - 'backend/src/skill-shared/python/**'
      - 'scripts/cli/**'
      - 'tests/**'
      - 'sclaw'
      - 'package.json'
      - '.github/workflows/backend-regression.yml'
      - '.github/workflows/analysis-regression.yml'

jobs:
  analysis-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies & Build
        run: |
          npm ci --prefix backend
          npm run build --prefix backend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Analysis Virtualenv
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -r backend/src/agent-skills/analysis/runtime/requirements.txt

      - name: Run Analysis Regression
        # CI may not always provide a usable OpenSeesPy runtime on Linux.
        # The regression suite still verifies unavailable-engine signaling,
        # auto-fallback routing, and the non-OpenSees regression surface.
        run: node tests/runner.mjs analysis-regression
