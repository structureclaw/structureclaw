name: Analysis Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/cli/**'
      - 'tests/**'
      - 'sclaw'
      - 'sclaw_cn'
      - 'package.json'
      - '.github/workflows/analysis-regression.yml'
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'scripts/cli/**'
      - 'tests/**'
      - 'sclaw'
      - 'sclaw_cn'
      - 'package.json'
      - '.github/workflows/analysis-regression.yml'

jobs:
  analysis-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run Analysis Regression
        # CI may not always provide a usable OpenSeesPy runtime on Linux.
        # The regression suite still verifies unavailable-engine signaling,
        # auto-fallback routing, and the non-OpenSees regression surface.
        run: node tests/runner.mjs analysis-regression
