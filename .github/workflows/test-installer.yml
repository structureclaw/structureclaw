name: Test Windows Docker CLI

on:
  push:
    branches: [master, main, 'feat/*']
    paths:
      - 'sclaw'
      - 'scripts/cli/**'
      - 'docker-compose.yml'
      - 'install.ps1'
      - 'package.json'
      - 'scripts/windows/install-helpers.psm1'
      - 'tests/windows/**'
      - '.github/workflows/test-installer.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'sclaw'
      - 'scripts/cli/**'
      - 'docker-compose.yml'
      - 'install.ps1'
      - 'package.json'
      - 'scripts/windows/install-helpers.psm1'
      - 'tests/windows/**'
      - '.github/workflows/test-installer.yml'

jobs:
  test-cli:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CLI tests
        shell: powershell
        run: npm run test:cli

  pester-install-helpers:
    runs-on: windows-latest
    needs: test-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester and run install helper tests
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Force -Scope CurrentUser -SkipPublisherCheck
          Invoke-Pester -Path ./tests/windows/install-helpers.Tests.ps1 -CI

  test-with-docker:
    runs-on: windows-latest
    needs: test-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start Docker service
        shell: powershell
        run: |
          # Wait for Docker to be ready
          $maxAttempts = 30
          $attempt = 0

          Write-Host "Waiting for Docker to start..."
          while ($attempt -lt $maxAttempts) {
            try {
              $result = docker version --format '{{.Server.Version}}' 2>$null
              if ($result) {
                Write-Host "Docker is ready: $result" -ForegroundColor Green
                break
              }
            }
            catch {}

            $attempt++
            Start-Sleep -Seconds 5
          }

          if ($attempt -eq $maxAttempts) {
            Write-Error "Docker failed to start"
            exit 1
          }

      - name: Validate docker compose configuration
        shell: powershell
        run: |
          docker compose config --quiet

      - name: Bootstrap docker stack through sclaw
        shell: powershell
        run: |
          node .\sclaw docker-install --non-interactive --llm-provider openai --llm-base-url https://api.openai.com/v1 --llm-api-key test-key-for-ci --llm-model gpt-4.1 --skip-api-test

      - name: Verify docker status through sclaw
        shell: powershell
        run: |
          node .\sclaw docker-status
          node .\sclaw docker-stop

      - name: Tear down docker stack
        if: always()
        shell: powershell
        run: |
          node .\sclaw docker-down
