name: Install smoke

on:
  workflow_dispatch:
  push:
    branches: [master, main, 'feat/*']
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.cn.yml'
      - 'docker/**'
      - '.env.example'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/cli/**'
      - 'tests/**'
      - 'sclaw'
      - 'sclaw_cn'
      - 'package.json'
      - '.github/workflows/install-smoke.yml'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.cn.yml'
      - 'docker/**'
      - '.env.example'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/cli/**'
      - 'tests/**'
      - 'sclaw'
      - 'sclaw_cn'
      - 'package.json'
      - '.github/workflows/install-smoke.yml'

jobs:
  native-install-smoke-linux:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: node:20-bookworm
      options: --add-host=host.docker.internal:host-gateway
      # 必须在这里显式覆盖 .env 文件中继承过来的所有变量
      env:
        # 1. 处理 HTTP 代理 (覆盖大小写)
        http_proxy: http://host.docker.internal:7891
        # 2. 处理 HTTPS 代理 (覆盖大小写)
        https_proxy: http://host.docker.internal:7891
        # 3. 处理 ALL_PROXY (这非常重要，Git 经常优先读这个)
        # 注意：统一转为 http 协议，避免容器内对 socks5h 的解析差异
        all_proxy: http://host.docker.internal:7891
        # 4. 修正 NO_PROXY
        no_proxy: localhost,127.0.0.1,host.docker.internal,.local,github.com
    timeout-minutes: 30

    steps:
      # 第一步增加一个调试输出，万一还是不行，看日志里的 IP 地址
      - name: Debug Network
        run: |
          ip route show | grep default
          getent hosts host.docker.internal
          curl -I https://www.google.com --connect-timeout 5

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          command: doctor
          build: true

      - name: Frontend type-check
        run: npm run type-check --prefix frontend

      - name: Frontend unit tests
        run: npm run test:run --prefix frontend

      - name: Frontend lint
        run: npm run lint --prefix frontend

  native-install-smoke-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          command: doctor
          build: true
      - name: Frontend type-check
        run: npm run type-check --prefix frontend
      - name: Frontend unit tests
        run: npm run test:run --prefix frontend
      - name: Frontend lint
        run: npm run lint --prefix frontend

  docker-compose-smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Docker compose smoke
        shell: bash
        run: node tests/runner.mjs smoke-docker

  docker-compose-smoke-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Docker is ready
        shell: powershell
        run: |
          $maxAttempts = 30
          $attempt = 0
          Write-Host 'Waiting for Docker...'
          while ($attempt -lt $maxAttempts) {
            try {
              $result = docker version --format '{{.Server.Os}}/{{.Server.Arch}} {{.Server.Version}}' 2>$null
              if ($LASTEXITCODE -eq 0 -and $result) {
                Write-Host "Docker is ready: $result"
                break
              }
            } catch {}
            $attempt++
            Start-Sleep -Seconds 5
          }
          if ($attempt -eq $maxAttempts) {
            throw 'Docker failed to start'
          }
      - name: Docker compose smoke
        shell: powershell
        run: node tests/runner.mjs smoke-docker