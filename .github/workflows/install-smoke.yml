name: Install smoke

on:
  workflow_dispatch:
  push:
    branches: [master, main, 'feat/*']
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.cn.yml'
      - 'docker/**'
      - '.env.example'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/cli/**'
      - 'tests/**'
      - 'sclaw'
      - 'sclaw_cn'
      - 'package.json'
      - '.github/workflows/install-smoke.yml'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.cn.yml'
      - 'docker/**'
      - '.env.example'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/cli/**'
      - 'tests/**'
      - 'sclaw'
      - 'sclaw_cn'
      - 'package.json'
      - '.github/workflows/install-smoke.yml'

jobs:
  native-install-smoke-linux:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: node:20-bookworm
      options: --add-host=host.docker.internal:host-gateway
      # container.env 小写变量覆盖 runner 注入的同名变量
      env:
        http_proxy: http://host.docker.internal:7891
        https_proxy: http://host.docker.internal:7891
        all_proxy: http://host.docker.internal:7891
        no_proxy: localhost,127.0.0.1,host.docker.internal,.local,github.com
    timeout-minutes: 30

    steps:
      # Runner 会注入 HTTP_PROXY=http://127.0.0.1:7891（大写），
      # container.env 不能同时声明大小写同名变量，
      # 所以用 GITHUB_ENV 在 checkout 之前覆盖大写变量
      - name: Override runner proxy vars
        shell: bash
        run: |
          echo "HTTP_PROXY=http://host.docker.internal:7891" >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=http://host.docker.internal:7891" >> "$GITHUB_ENV"
          echo "ALL_PROXY=http://host.docker.internal:7891" >> "$GITHUB_ENV"
          echo "NO_PROXY=localhost,127.0.0.1,host.docker.internal,.local,github.com" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          command: doctor
          build: true

      - name: Frontend type-check
        run: npm run type-check --prefix frontend

      - name: Frontend unit tests
        run: npm run test:run --prefix frontend

      - name: Frontend lint
        run: npm run lint --prefix frontend

  native-install-smoke-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          command: doctor
          build: true
      - name: Frontend type-check
        run: npm run type-check --prefix frontend
      - name: Frontend unit tests
        run: npm run test:run --prefix frontend
      - name: Frontend lint
        run: npm run lint --prefix frontend

  docker-compose-smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Docker compose smoke
        shell: bash
        run: node tests/runner.mjs smoke-docker

  docker-compose-smoke-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Docker is ready
        shell: powershell
        run: |
          $maxAttempts = 30
          $attempt = 0
          Write-Host 'Waiting for Docker...'
          while ($attempt -lt $maxAttempts) {
            try {
              $result = docker version --format '{{.Server.Os}}/{{.Server.Arch}} {{.Server.Version}}' 2>$null
              if ($LASTEXITCODE -eq 0 -and $result) {
                Write-Host "Docker is ready: $result"
                break
              }
            } catch {}
            $attempt++
            Start-Sleep -Seconds 5
          }
          if ($attempt -eq $maxAttempts) {
            throw 'Docker failed to start'
          }
      - name: Docker compose smoke
        shell: powershell
        run: node tests/runner.mjs smoke-docker