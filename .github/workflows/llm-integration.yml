name: LLM Integration Tests

on:
  workflow_dispatch:
    inputs:
      llm_model:
        description: "LLM model name (leave empty for default)"
        required: false
        default: ""
      filter:
        description: "Test category filter (routing|extraction|pipeline|clarification)"
        required: false
        default: ""

jobs:
  llm-integration-linux:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: node:20-bookworm
      options: --add-host=host.docker.internal:host-gateway
      env:
        http_proxy: http://host.docker.internal:7891
        https_proxy: http://host.docker.internal:7891
        all_proxy: http://host.docker.internal:7891
        no_proxy: localhost,127.0.0.1,host.docker.internal,.local,github.com
    timeout-minutes: 30
    steps:
      - name: Override runner proxy vars
        shell: bash
        run: |
          echo "HTTP_PROXY=http://host.docker.internal:7891" >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=http://host.docker.internal:7891" >> "$GITHUB_ENV"
          echo "ALL_PROXY=http://host.docker.internal:7891" >> "$GITHUB_ENV"
          echo "NO_PROXY=localhost,127.0.0.1,host.docker.internal,.local,github.com" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          command: doctor
          build: true

      - name: Run LLM integration tests
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ github.event.inputs.llm_model || '' }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai-compatible' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || '' }}
          LLM_LOG_ENABLED: "true"
          REDIS_URL: disabled
          DATABASE_URL: "file:.runtime/data/structureclaw-llm-ci.db"
        run: node tests/runner.mjs llm-integration ${{ github.event.inputs.filter && format('--filter {0}', github.event.inputs.filter) || '' }}

      - name: Upload LLM call logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-logs-linux
          path: .runtime/logs/llm-calls.jsonl
          retention-days: 7
          if-no-files-found: ignore

  llm-integration-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          command: doctor
          build: true

      - name: Run LLM integration tests
        shell: pwsh
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ github.event.inputs.llm_model || '' }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai-compatible' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || '' }}
          LLM_LOG_ENABLED: "true"
          REDIS_URL: disabled
          DATABASE_URL: "file:.runtime/data/structureclaw-llm-ci.db"
        run: node tests/runner.mjs llm-integration ${{ github.event.inputs.filter && format('--filter {0}', github.event.inputs.filter) || '' }}

      - name: Upload LLM call logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-logs-windows
          path: .runtime/logs/llm-calls.jsonl
          retention-days: 7
          if-no-files-found: ignore
